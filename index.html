  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #08090c; color: #f0f4ff; -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior: none; }
    input, select, textarea, button { font-family: inherit; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
    #splash {
      position: fixed; inset: 0; background: #08090c;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      z-index: 999; transition: opacity 0.5s;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #1e2330; border-top-color: #3b82f6;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

      <text x="40" y="60" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="46" font-weight="800" fill="#1d4ed8">J</text>
    </svg>
    <div class="spinner"></div>
    <div style="font-family:-apple-system,sans-serif;font-size:13px;color:#3d4760;letter-spacing:0.1em">HOMELAB</div>
  </div>
  <div id="root"></div>
  <script>
    const observer = new MutationObserver(() => {
      if (document.getElementById("root").children.length > 0) {
        document.getElementById("splash").classList.add("hidden");
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById("root"), { childList: true, subtree: true });
    setTimeout(() => { document.getElementById("splash").classList.add("hidden"); }, 20000);
  </script>
