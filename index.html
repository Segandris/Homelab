function MetricsModule({metrics,setMetrics,persist}){
  const[view,setView]=useState("log");
  const[date,setDate]=useState(new Date().toISOString().split("T")[0]);
  const[weight,setWeight]=useState("");
  const[bf,setBf]=useState("");
  const[unit,setUnit]=useState("kg");
  const[goalWeight,setGoalWeight]=useState(metrics.goalWeight||"");
  const[goalBf,setGoalBf]=useState(metrics.goalBf||"");
  const[editGoals,setEditGoals]=useState(false);
  const[saveMsg,setSaveMsg]=useState("");
  const entries=metrics.entries||[];

  async function logEntry(){
    if(!weight&&!bf){setSaveMsg("Enter at least weight or body fat.");return;}
    const entry={id:Date.now(),date,weight:parseFloat(weight)||null,bf:parseFloat(bf)||null,unit};
    const updated={...metrics,entries:[entry,...entries.filter(e=>e.date!==date)]};
    setMetrics(updated);await persist(SK.metrics,updated);
    setWeight("");setBf("");setSaveMsg("Logged!");setTimeout(()=>setSaveMsg(""),2000);
  }

  async function deleteEntry(id){
    const updated={...metrics,entries:entries.filter(e=>e.id!==id)};
    setMetrics(updated);await persist(SK.metrics,updated);
  }

  async function saveGoals(){
    const updated={...metrics,goalWeight:parseFloat(goalWeight)||null,goalBf:parseFloat(goalBf)||null};
    setMetrics(updated);await persist(SK.metrics,updated);setEditGoals(false);
  }

  const sorted=[...entries].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const latest=entries[0];
  const weightEntries=sorted.filter(e=>e.weight!=null);
  const bfEntries=sorted.filter(e=>e.bf!=null);

  // Simple SVG sparkline
  function Sparkline({data,color,goal,unit:u}){
    if(data.length<2) return <div style={{color:C.textDim,fontSize:"12px",padding:"20px 0",textAlign:"center"}}>Need 2+ entries to show chart</div>;
    const vals=data.map(e=>e.weight!=null?e.weight:e.bf);
    const W=320,H=80,PAD=8;
    const min=Math.min(...vals,goal||Infinity)-2;
    const max=Math.max(...vals,goal||-Infinity)+2;
    const range=max-min||1;
    const pts=vals.map((v,i)=>{
      const x=PAD+(i/(vals.length-1))*(W-PAD*2);
      const y=PAD+((max-v)/range)*(H-PAD*2);
      return[x,y];
    });
    const path="M"+pts.map(p=>p.join(",")).join("L");
    const goalY=goal!=null?PAD+((max-goal)/range)*(H-PAD*2):null;
    return(
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible"}}>
        {goalY!=null&&<line x1={PAD} y1={goalY} x2={W-PAD} y2={goalY} stroke={C.green} strokeWidth="1" strokeDasharray="4,3" opacity="0.6"/>}
        <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
        {pts.map(([x,y],i)=>(
          <circle key={i} cx={x} cy={y} r="3" fill={color}/>
        ))}
        <text x={pts[pts.length-1][0]} y={pts[pts.length-1][1]-6} fill={color} fontSize="10" textAnchor="middle" fontWeight="700">{vals[vals.length-1]}{u}</text>
        {goalY!=null&&<text x={W-PAD} y={goalY-4} fill={C.green} fontSize="9" textAnchor="end">goal</text>}
      </svg>
    );
  }

  const TABS=[["log","Log"],["chart","Chart"],["history","History"]];
  return(
    <div>
      <div style={{display:"flex",background:C.surface,borderBottom:`1px solid ${C.border}`,marginBottom:"16px",borderRadius:"12px",overflow:"hidden"}}>
        {TABS.map(([k,l])=><button key={k} onClick={()=>setView(k)} style={{flex:1,padding:"10px 0",background:"none",border:"none",borderBottom:view===k?`2px solid ${C.cyan}`:"2px solid transparent",color:view===k?C.cyan:C.textMid,fontSize:"12px",fontWeight:view===k?"700":"500",cursor:"pointer",fontFamily:font,transition:"all 0.15s"}}>{l}</button>)}
      </div>

      {view==="log"&&<div>
        {/* Latest snapshot */}
        {latest&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"16px"}}>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"14px"}}>
              <div style={{fontSize:"11px",color:C.textDim,fontWeight:"700",letterSpacing:"0.08em",marginBottom:"6px"}}>WEIGHT</div>
              <div style={{fontSize:"26px",fontWeight:"800",color:C.cyan}}>{latest.weight!=null?`${latest.weight}${latest.unit}`:"—"}</div>
              {metrics.goalWeight&&latest.weight!=null&&<div style={{fontSize:"11px",color:C.textMid,marginTop:"3px"}}>Goal: {metrics.goalWeight}{latest.unit}</div>}
            </div>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"14px"}}>
              <div style={{fontSize:"11px",color:C.textDim,fontWeight:"700",letterSpacing:"0.08em",marginBottom:"6px"}}>BODY FAT</div>
              <div style={{fontSize:"26px",fontWeight:"800",color:C.purple}}>{latest.bf!=null?`${latest.bf}%`:"—"}</div>
              {metrics.goalBf&&latest.bf!=null&&<div style={{fontSize:"11px",color:C.textMid,marginTop:"3px"}}>Goal: {metrics.goalBf}%</div>}
            </div>
          </div>
        )}

        {/* Log form */}
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px",marginBottom:"14px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:C.textMid,marginBottom:"12px",letterSpacing:"0.04em"}}>LOG ENTRY</div>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...field,marginBottom:"10px"}}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 80px",gap:"8px",marginBottom:"10px"}}>
            <input type="number" inputMode="decimal" placeholder="Weight" value={weight} onChange={e=>setWeight(e.target.value)} style={numInput}/>
            <input type="number" inputMode="decimal" placeholder="Body fat %" value={bf} onChange={e=>setBf(e.target.value)} style={numInput}/>
            <select value={unit} onChange={e=>setUnit(e.target.value)} style={{...numInput,padding:"10px 6px"}}>
              <option>kg</option><option>lb</option>
            </select>
          </div>
          <button onClick={logEntry} style={primaryBtn(C.cyan)}>Log Entry</button>
          {saveMsg&&<div style={{marginTop:"10px",padding:"10px",background:"rgba(56,189,248,0.1)",border:`1px solid ${C.cyan}`,borderRadius:"8px",color:C.cyan,fontSize:"13px",fontWeight:"600",textAlign:"center"}}>{saveMsg}</div>}
        </div>

        {/* Goals */}
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
            <div style={{fontSize:"13px",fontWeight:"700",color:C.textMid,letterSpacing:"0.04em"}}>GOALS</div>
            <button onClick={()=>setEditGoals(!editGoals)} style={{background:"none",border:"none",color:C.cyan,fontSize:"13px",fontWeight:"600",cursor:"pointer",fontFamily:font}}>{editGoals?"Cancel":"Edit"}</button>
          </div>
          {editGoals?(
            <div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"10px"}}>
                <input type="number" inputMode="decimal" placeholder={`Goal weight (${unit})`} value={goalWeight} onChange={e=>setGoalWeight(e.target.value)} style={numInput}/>
                <input type="number" inputMode="decimal" placeholder="Goal body fat %" value={goalBf} onChange={e=>setGoalBf(e.target.value)} style={numInput}/>
              </div>
              <button onClick={saveGoals} style={{...primaryBtn(C.cyan),padding:"12px"}}>Save Goals</button>
            </div>
          ):(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
              <div style={{background:C.surface,borderRadius:"10px",padding:"10px",textAlign:"center"}}>
                <div style={{fontSize:"11px",color:C.textDim,marginBottom:"4px"}}>WEIGHT GOAL</div>
                <div style={{fontSize:"18px",fontWeight:"700",color:metrics.goalWeight?C.cyan:C.textDim}}>{metrics.goalWeight?`${metrics.goalWeight}${unit}`:"Not set"}</div>
              </div>
              <div style={{background:C.surface,borderRadius:"10px",padding:"10px",textAlign:"center"}}>
                <div style={{fontSize:"11px",color:C.textDim,marginBottom:"4px"}}>BODY FAT GOAL</div>
                <div style={{fontSize:"18px",fontWeight:"700",color:metrics.goalBf?C.purple:C.textDim}}>{metrics.goalBf?`${metrics.goalBf}%`:"Not set"}</div>
              </div>
            </div>
          )}
        </div>
      </div>}

      {view==="chart"&&<div>
        {weightEntries.length===0&&bfEntries.length===0?(
          <Empty icon="📊" text="No data yet" sub="Log some entries to see your charts"/>
        ):<>
          {/* Trend callouts */}
          {(weightEntries.length>=2||bfEntries.length>=2)&&(()=>{
            const periods=[{label:"7d",days:7},{label:"30d",days:30},{label:"All",days:9999}];
            const now=new Date();
            return(
              <div style={{marginBottom:"16px"}}>
                <div style={{fontSize:"11px",fontWeight:"700",letterSpacing:"0.08em",color:C.textDim,marginBottom:"10px"}}>TRENDS</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
                  {weightEntries.length>=2&&periods.slice(0,2).map(({label,days})=>{
                    const cutoff=new Date(now-days*86400000).toISOString().split("T")[0];
                    const slice=weightEntries.filter(e=>e.date>=cutoff);
                    if(slice.length<2)return null;
                    const diff=slice[slice.length-1].weight-slice[0].weight;
                    const down=diff<0;
                    return(
                      <div key={"w"+label} style={{background:C.card,border:`1px solid ${down?C.green+"55":C.border}`,borderRadius:"12px",padding:"12px"}}>
                        <div style={{fontSize:"10px",fontWeight:"700",color:C.textDim,letterSpacing:"0.08em",marginBottom:"4px"}}>WEIGHT · {label}</div>
                        <div style={{fontSize:"22px",fontWeight:"800",color:down?C.green:C.red}}>{diff>0?"+":""}{diff.toFixed(1)}<span style={{fontSize:"13px",fontWeight:"500",color:C.textMid}}>{slice[0].unit}</span></div>
                        <div style={{fontSize:"11px",color:C.textMid,marginTop:"2px"}}>{down?"↓ losing":"↑ gaining"}</div>
                      </div>
                    );
                  })}
                  {bfEntries.length>=2&&periods.slice(0,2).map(({label,days})=>{
                    const cutoff=new Date(now-days*86400000).toISOString().split("T")[0];
                    const slice=bfEntries.filter(e=>e.date>=cutoff);
                    if(slice.length<2)return null;
                    const diff=slice[slice.length-1].bf-slice[0].bf;
                    const down=diff<0;
                    return(
                      <div key={"bf"+label} style={{background:C.card,border:`1px solid ${down?C.green+"55":C.border}`,borderRadius:"12px",padding:"12px"}}>
                        <div style={{fontSize:"10px",fontWeight:"700",color:C.textDim,letterSpacing:"0.08em",marginBottom:"4px"}}>BODY FAT · {label}</div>
                        <div style={{fontSize:"22px",fontWeight:"800",color:down?C.green:C.red}}>{diff>0?"+":""}{diff.toFixed(1)}<span style={{fontSize:"13px",fontWeight:"500",color:C.textMid}}>%</span></div>
                        <div style={{fontSize:"11px",color:C.textMid,marginTop:"2px"}}>{down?"↓ dropping":"↑ rising"}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}

          {/* Goal progress bars */}
          {(metrics.goalWeight||metrics.goalBf)&&(weightEntries.length>0||bfEntries.length>0)&&(
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px",marginBottom:"16px"}}>
              <div style={{fontSize:"11px",fontWeight:"700",letterSpacing:"0.08em",color:C.textDim,marginBottom:"12px"}}>GOAL PROGRESS</div>
              {metrics.goalWeight&&weightEntries.length>0&&(()=>{
                const start=weightEntries[0].weight;
                const current=weightEntries[weightEntries.length-1].weight;
                const goal=metrics.goalWeight;
                const unit=weightEntries[0].unit;
                const totalChange=Math.abs(start-goal);
                const achieved=Math.abs(start-current);
                const pct=totalChange>0?Math.min(100,Math.round((achieved/totalChange)*100)):100;
                const toGo=Math.abs(current-goal).toFixed(1);
                const done=current<=goal;
                return(
                  <div style={{marginBottom:"12px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:"5px"}}>
                      <span style={{fontSize:"13px",color:C.text,fontWeight:"500"}}>Weight → {goal}{unit}</span>
                      <span style={{fontSize:"13px",fontWeight:"700",color:done?C.green:C.cyan}}>{done?"✓ Goal reached!":`${toGo}${unit} to go`}</span>
                    </div>
                    <div style={{height:"8px",background:C.surface,borderRadius:"4px",overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${pct}%`,background:done?C.green:C.cyan,borderRadius:"4px",transition:"width 0.4s"}}/>
                    </div>
                    <div style={{fontSize:"11px",color:C.textDim,marginTop:"4px"}}>{pct}% of the way there · started at {start}{unit}</div>
                  </div>
                );
              })()}
              {metrics.goalBf&&bfEntries.length>0&&(()=>{
                const start=bfEntries[0].bf;
                const current=bfEntries[bfEntries.length-1].bf;
                const goal=metrics.goalBf;
                const totalChange=Math.abs(start-goal);
                const achieved=Math.abs(start-current);
                const pct=totalChange>0?Math.min(100,Math.round((achieved/totalChange)*100)):100;
                const toGo=Math.abs(current-goal).toFixed(1);
                const done=current<=goal;
                return(
                  <div>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:"5px"}}>
                      <span style={{fontSize:"13px",color:C.text,fontWeight:"500"}}>Body fat → {goal}%</span>
                      <span style={{fontSize:"13px",fontWeight:"700",color:done?C.green:C.purple}}>{done?"✓ Goal reached!":`${toGo}% to go`}</span>
                    </div>
                    <div style={{height:"8px",background:C.surface,borderRadius:"4px",overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${pct}%`,background:done?C.green:C.purple,borderRadius:"4px",transition:"width 0.4s"}}/>
                    </div>
                    <div style={{fontSize:"11px",color:C.textDim,marginTop:"4px"}}>{pct}% of the way there · started at {start}%</div>
                  </div>
                );
              })()}
            </div>
          )}

          {/* Charts */}
          {weightEntries.length>0&&(
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px",marginBottom:"14px"}}>
              <div style={{fontSize:"14px",fontWeight:"700",color:C.text,marginBottom:"12px"}}>Weight over time</div>
              <Sparkline data={weightEntries} color={C.cyan} goal={metrics.goalWeight} unit={weightEntries[0]?.unit||"kg"}/>
            </div>
          )}
          {bfEntries.length>0&&(
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px"}}>
              <div style={{fontSize:"14px",fontWeight:"700",color:C.text,marginBottom:"12px"}}>Body fat % over time</div>
              <Sparkline data={bfEntries} color={C.purple} goal={metrics.goalBf} unit="%"/>
            </div>
          )}
        </>}
      </div>}

      {view==="history"&&<div>
        {entries.length===0?<Empty icon="📋" text="No entries yet" sub="Start logging to build your history"/>:entries.map(e=>(
          <div key={e.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"13px 16px",marginBottom:"8px",display:"flex",alignItems:"center",gap:"12px"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:"14px",fontWeight:"600",color:C.text,marginBottom:"3px"}}>{fmtDate(e.date)}</div>
              <div style={{display:"flex",gap:"12px"}}>
                {e.weight!=null&&<span style={{fontSize:"13px",color:C.cyan,fontWeight:"600"}}>{e.weight}{e.unit}</span>}
                {e.bf!=null&&<span style={{fontSize:"13px",color:C.purple,fontWeight:"600"}}>{e.bf}%</span>}
              </div>
            </div>
            <button onClick={()=>deleteEntry(e.id)} style={iconBtn(C.textDim)}>✕</button>
          </div>
        ))}
      </div>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   WORKOUT TEMPLATES MODULE
═══════════════════════════════════════════════════════════════════════════ */
function TemplatesModule({templates,setTemplates,persist,onLoadTemplate}){
  const[view,setView]=useState("list"); // list | create | edit
  const[editingId,setEditingId]=useState(null);
  const[tName,setTName]=useState("");
  const[tExercises,setTEx]=useState([]);
  const[picker,setPicker]=useState(false);

  function startNew(){setTName("");setTEx([]);setEditingId(null);setView("create");}
  function startEdit(t){setTName(t.name);setTEx(t.exercises.map(e=>({...e,id:Date.now()+Math.random()})));setEditingId(t.id);setView("create");}

  function pickEx(ex){
    setTEx(p=>[...p,{id:Date.now(),name:ex.name,muscle:ex.muscle,category:ex.category,isCardio:ex.type==="cardio",sets:[{reps:"",weight:"",unit:"kg"}]}]);
    setPicker(false);
  }

  function removeEx(id){setTEx(p=>p.filter(e=>e.id!==id));}

  function updateSet(id,idx,f,val){
    setTEx(p=>p.map(e=>e.id!==id?e:{...e,sets:e.sets.map((s,i)=>i===idx?{...s,[f]:val}:s)}));
  }
  function addSet(id){
    setTEx(p=>p.map(e=>{
      if(e.id!==id)return e;
      const last=e.sets.at(-1);
      return{...e,sets:[...e.sets,{reps:last?.reps||"",weight:last?.weight||"",unit:last?.unit||"kg"}]};
    }));
  }
  function removeSet(id,idx){
    setTEx(p=>p.map(e=>{
      if(e.id!==id)return e;
      const sets=e.sets.filter((_,i)=>i!==idx);
      return{...e,sets:sets.length?sets:[{reps:"",weight:"",unit:"kg"}]};
    }));
  }

  async function saveTemplate(){
    if(!tName.trim()||!tExercises.length)return;
    const t={id:editingId||Date.now(),name:tName.trim(),exercises:tExercises.map(({name,muscle,category,isCardio,sets})=>({name,muscle,category,isCardio,sets})),updated:new Date().toISOString()};
    const updated=editingId?templates.map(x=>x.id===editingId?t:x):[t,...templates];
    setTemplates(updated);await persist(SK.templates,updated);setView("list");
  }

  async function deleteTemplate(id){
    const updated=templates.filter(t=>t.id!==id);setTemplates(updated);await persist(SK.templates,updated);
  }

  if(view==="create") return(
    <div>
      {picker&&<ExercisePicker onSelect={pickEx} onClose={()=>setPicker(false)}/>}
      <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"16px"}}>
        <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.textMid,fontSize:"22px",cursor:"pointer",padding:"0",lineHeight:1}}>‹</button>
        <div style={{fontSize:"17px",fontWeight:"700",color:C.text}}>{editingId?"Edit Template":"New Template"}</div>
      </div>
      <input placeholder="Template name (e.g. Push Day)" value={tName} onChange={e=>setTName(e.target.value)} style={{...field,marginBottom:"14px"}}/>

      {tExercises.map((ex,idx)=>(
        <div key={ex.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",marginBottom:"10px",overflow:"hidden"}}>
          <div style={{padding:"10px 14px",background:C.surface,borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:"10px"}}>
            <div style={{width:"8px",height:"8px",borderRadius:"50%",flexShrink:0,background:CAT_COLOR[ex.category]||C.blue}}/>
            <div style={{flex:1}}>
              <div style={{fontSize:"14px",fontWeight:"600",color:C.text}}>{ex.name}</div>
              <div style={{fontSize:"11px",color:C.textMid}}>{ex.category} · {ex.muscle}</div>
            </div>
            <button onClick={()=>removeEx(ex.id)} style={iconBtn(C.textDim)}>✕</button>
          </div>
          <div style={{padding:"10px 14px"}}>
            <div style={{display:"grid",gridTemplateColumns:"24px 1fr 1fr 60px 24px",gap:"6px",marginBottom:"6px"}}>
              <span style={lbl}>#</span><span style={lbl}>REPS</span><span style={lbl}>WEIGHT</span><span style={lbl}>UNIT</span><span/>
            </div>
            {ex.sets.map((s,si)=>(
              <div key={si} style={{display:"grid",gridTemplateColumns:"24px 1fr 1fr 60px 24px",gap:"6px",marginBottom:"6px",alignItems:"center"}}>
                <div style={{width:"22px",height:"22px",borderRadius:"6px",background:C.blueDim,color:C.blueText,fontSize:"10px",fontWeight:"700",display:"flex",alignItems:"center",justifyContent:"center"}}>{si+1}</div>
                <input type="number" placeholder="—" value={s.reps} onChange={e=>updateSet(ex.id,si,"reps",e.target.value)} style={numInput}/>
                <input type="number" placeholder="—" value={s.weight} onChange={e=>updateSet(ex.id,si,"weight",e.target.value)} style={numInput}/>
                <select value={s.unit} onChange={e=>updateSet(ex.id,si,"unit",e.target.value)} style={{...numInput,padding:"10px 4px"}}><option>kg</option><option>lb</option></select>
                <button onClick={()=>removeSet(ex.id,si)} style={iconBtn(C.textDim)}>✕</button>
              </div>
            ))}
            <button onClick={()=>addSet(ex.id)} style={{marginTop:"2px",padding:"7px 12px",background:C.blueGlow,border:`1px solid ${C.blueDim}`,borderRadius:"8px",color:C.blueText,fontSize:"12px",fontWeight:"600",cursor:"pointer",fontFamily:font}}>+ Set</button>
          </div>
        </div>
      ))}

      <button onClick={()=>setPicker(true)} style={{width:"100%",padding:"13px",background:C.blueGlow,border:`1.5px dashed ${C.blueDim}`,borderRadius:"14px",color:C.blue,fontSize:"14px",fontWeight:"600",cursor:"pointer",fontFamily:font,marginBottom:"14px",display:"flex",alignItems:"center",justifyContent:"center",gap:"8px"}}>+ Add Exercise</button>
      <button onClick={saveTemplate} disabled={!tName.trim()||!tExercises.length} style={{...primaryBtn(C.green),opacity:(!tName.trim()||!tExercises.length)?0.5:1}}>
        {editingId?"Update Template":"Save Template"}
      </button>
    </div>
  );

  return(
    <div>
      <button onClick={startNew} style={{...primaryBtn(C.green),marginBottom:"16px"}}>+ New Template</button>
      {templates.length===0?<Empty icon="📋" text="No templates yet" sub="Create a template to quickly start a workout"/>:templates.map(t=>(
        <div key={t.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",marginBottom:"10px",overflow:"hidden"}}>
          <div style={{padding:"13px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:"10px"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:"15px",fontWeight:"700",color:C.text}}>{t.name}</div>
              <div style={{fontSize:"12px",color:C.textMid,marginTop:"2px"}}>{t.exercises.length} exercise{t.exercises.length!==1?"s":""}</div>
            </div>
            <button onClick={()=>startEdit(t)} style={{...iconBtn(C.textMid),background:C.surface,borderRadius:"8px",border:`1px solid ${C.border}`,padding:"6px 10px",fontSize:"13px"}}>Edit</button>
            <button onClick={()=>deleteTemplate(t.id)} style={iconBtn(C.textDim)}>✕</button>
          </div>
          <div style={{padding:"10px 16px"}}>
            <div style={{display:"flex",flexWrap:"wrap",gap:"5px",marginBottom:"12px"}}>
              {t.exercises.map((ex,i)=>(
                <span key={i} style={{padding:"3px 8px",borderRadius:"8px",fontSize:"11px",fontWeight:"600",background:`${CAT_COLOR[ex.category]||C.blue}22`,color:CAT_COLOR[ex.category]||C.blue}}>
                  {ex.name}
                </span>
              ))}
            </div>
            <button onClick={()=>onLoadTemplate(t)} style={{width:"100%",padding:"10px",background:`linear-gradient(135deg,${C.green},${C.green}cc)`,border:"none",borderRadius:"10px",color:"#fff",fontSize:"13px",fontWeight:"700",cursor:"pointer",fontFamily:font,boxShadow:`0 2px 10px ${C.green}44`}}>
              ▶ Start Workout
            </button>
          </div>
        </div>
      ))}
    </div>
  );
}

function ExerciseModule({sessions,setSessions,persist,templates,setTemplates}){
  const[view,setView]=useState("log");const[saving,setSaving]=useState(false);const[picker,setPicker]=useState(false);const[saveMsg,setSaveMsg]=useState("");
  const[date,setDate]=useState(new Date().toISOString().split("T")[0]);const[name,setName]=useState("");const[exercises,setEx]=useState([]);const[notes,setNotes]=useState("");

  function loadTemplate(t){
    setEx(t.exercises.map(ex=>({...ex,id:Date.now()+Math.random()})));
    setName(t.name);setView("log");
  }
  function pickExercise(ex){const cardio=ex.type==="cardio";setEx(p=>[...p,{id:Date.now(),name:ex.name,muscle:ex.muscle,category:ex.category,isCardio:cardio,sets:cardio?[{duration:"",distance:"",unit:"km"}]:[{reps:"",weight:"",unit:"kg"}]}]);setPicker(false);}
  function removeEx(id){setEx(p=>p.filter(e=>e.id!==id));}
  function addSet(id){setEx(p=>p.map(e=>{if(e.id!==id)return e;const last=e.sets.at(-1);const s=e.isCardio?{duration:last?.duration||"",distance:last?.distance||"",unit:last?.unit||"km"}:{reps:last?.reps||"",weight:last?.weight||"",unit:last?.unit||"kg"};return{...e,sets:[...e.sets,s]};}));}
  function removeSet(id,idx){setEx(p=>p.map(e=>{if(e.id!==id)return e;const sets=e.sets.filter((_,i)=>i!==idx);const empty=e.isCardio?[{duration:"",distance:"",unit:"km"}]:[{reps:"",weight:"",unit:"kg"}];return{...e,sets:sets.length?sets:empty};}));}
  function updateSet(id,idx,f,val){setEx(p=>p.map(e=>e.id!==id?e:{...e,sets:e.sets.map((s,i)=>i===idx?{...s,[f]:val}:s)}));}
  async function saveSession(){if(!exercises.length){setSaveMsg("Add at least one exercise.");return;}setSaving(true);const session={id:Date.now(),date,name:name||"Workout",exercises:exercises.map(({name,muscle,category,isCardio,sets})=>({name,muscle,category,isCardio,sets})),notes};const updated=[session,...sessions];setSessions(updated);await persist(SK.workouts,updated);setEx([]);setNotes("");setName("");setDate(new Date().toISOString().split("T")[0]);setSaving(false);setSaveMsg("Saved!");setTimeout(()=>setSaveMsg(""),2500);}
  async function deleteSession(id){const updated=sessions.filter(s=>s.id!==id);setSessions(updated);await persist(SK.workouts,updated);}
  const bests=useMemo(()=>{const b={};sessions.forEach(s=>s.exercises.forEach(ex=>{if(ex.isCardio)return;ex.sets.forEach(set=>{const w=parseFloat(set.weight),r=parseInt(set.reps);if(!w||!r)return;if(!b[ex.name]||w>b[ex.name].weight)b[ex.name]={weight:w,reps:r,unit:set.unit,date:s.date,muscle:ex.muscle};});}));return b;},[sessions]);
  const TABS=[["log","Log"],["templates","Templates"],["history","History"],["browse","Browse"],["progress","Bests"]];
  return(
    <div>
      {picker&&<ExercisePicker onSelect={pickExercise} onClose={()=>setPicker(false)}/>}
      <div style={{display:"flex",background:C.surface,borderBottom:`1px solid ${C.border}`,marginBottom:"16px",borderRadius:"12px",overflow:"hidden"}}>
        {TABS.map(([k,l])=><button key={k} onClick={()=>setView(k)} style={{flex:1,padding:"10px 0",background:"none",border:"none",borderBottom:view===k?`2px solid ${C.green}`:"2px solid transparent",color:view===k?C.green:C.textMid,fontSize:"12px",fontWeight:view===k?"700":"500",cursor:"pointer",fontFamily:font,transition:"all 0.15s"}}>{l}</button>)}
      </div>
      {view==="log"&&<div>
        <div style={{display:"flex",gap:"10px",marginBottom:"16px"}}>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...field,flex:"0 0 auto",width:"auto",fontSize:"14px"}}/>
          <input placeholder="Session name" value={name} onChange={e=>setName(e.target.value)} style={{...field,flex:1,fontSize:"14px"}}/>
        </div>
        {exercises.map(ex=><ExerciseCard key={ex.id} ex={ex} onRemove={removeEx} onAddSet={addSet} onRemoveSet={removeSet} onUpdateSet={updateSet}/>)}
        <button onClick={()=>setPicker(true)} style={{width:"100%",padding:"15px",background:C.blueGlow,border:`1.5px dashed ${C.blueDim}`,borderRadius:"14px",color:C.blue,fontSize:"15px",fontWeight:"600",cursor:"pointer",fontFamily:font,marginBottom:"14px",display:"flex",alignItems:"center",justifyContent:"center",gap:"8px"}} onMouseOver={e=>{e.currentTarget.style.background="rgba(59,130,246,0.2)";e.currentTarget.style.borderColor=C.blue;}} onMouseOut={e=>{e.currentTarget.style.background=C.blueGlow;e.currentTarget.style.borderColor=C.blueDim;}}>+ Add Exercise</button>
        <textarea placeholder="Session notes..." value={notes} onChange={e=>setNotes(e.target.value)} rows={3} style={{...field,resize:"vertical",marginBottom:"14px"}}/>
        <button onClick={saveSession} disabled={saving} style={{...primaryBtn(C.green),opacity:saving?0.7:1}}>{saving?"Saving…":"Save Session"}</button>
        {saveMsg&&<div style={{marginTop:"12px",padding:"12px 16px",background:C.greenDim,border:`1px solid ${C.green}`,borderRadius:"10px",color:C.green,fontSize:"14px",fontWeight:"600",textAlign:"center"}}>{saveMsg}</div>}
      </div>}
      {view==="history"&&<div>{sessions.length===0?<Empty icon="📋" text="No sessions yet" sub="Log your first workout to get started"/>:sessions.map(s=>(
        <div key={s.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",marginBottom:"12px",overflow:"hidden"}}>
          <div style={{padding:"13px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{fontWeight:"700",fontSize:"16px"}}>{s.name}</div><div style={{fontSize:"12px",color:C.textMid,marginTop:"3px"}}>{fmtDate(s.date)}<span style={{marginLeft:"8px",color:C.green,fontWeight:"500"}}>{fmtRel(s.date)}</span></div></div>
            <button onClick={()=>deleteSession(s.id)} style={{...iconBtn(),background:C.surface,borderRadius:"8px",border:`1px solid ${C.border}`,fontSize:"14px",padding:"6px 8px"}}>✕</button>
          </div>
          <div style={{padding:"12px 16px"}}>{s.exercises.map((ex,i)=><div key={i} style={{marginBottom:"10px"}}><div style={{display:"flex",alignItems:"center",gap:"7px",marginBottom:"5px"}}><span style={{width:"7px",height:"7px",borderRadius:"50%",flexShrink:0,background:CAT_COLOR[ex.category]||C.blue}}/><span style={{fontSize:"14px",fontWeight:"600"}}>{ex.name}</span><span style={{fontSize:"12px",color:C.textMid}}>· {ex.muscle}</span></div><div style={{display:"flex",flexWrap:"wrap",gap:"5px",paddingLeft:"14px"}}>{ex.sets.map((set,si)=><span key={si} style={{padding:"4px 10px",background:C.surface,border:`1px solid ${C.border}`,borderRadius:"8px",fontSize:"12px",color:C.textMid}}>{ex.isCardio?`${set.duration||"—"}min${set.distance?` · ${set.distance}${set.unit}`:""}`:` ${set.reps||"—"} × ${set.weight||"—"}${set.unit}`}</span>)}</div></div>)}{s.notes&&<div style={{fontSize:"13px",color:C.textMid,marginTop:"8px",padding:"8px 10px",background:C.surface,borderRadius:"8px",fontStyle:"italic"}}>{s.notes}</div>}</div>
        </div>
      ))}</div>}
      {view==="templates"&&<TemplatesModule templates={templates} setTemplates={setTemplates} persist={persist} onLoadTemplate={loadTemplate}/>}
      {view==="browse"&&<BrowseView/>}
      {view==="progress"&&<div>{Object.keys(bests).length===0?<Empty icon="🏆" text="No data yet" sub="Log sessions to see your personal bests"/>:<>{<div style={{fontSize:"12px",fontWeight:"700",letterSpacing:"0.08em",color:C.textDim,marginBottom:"14px"}}>PERSONAL BESTS — HEAVIEST SET</div>}{Object.entries(bests).sort((a,b)=>a[0].localeCompare(b[0])).map(([exName,best])=><div key={exName} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"14px 16px",marginBottom:"8px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontWeight:"600",fontSize:"15px"}}>{exName}</div><div style={{fontSize:"12px",color:C.textMid,marginTop:"3px"}}>{best.muscle} · {fmtDate(best.date)}</div></div><div style={{textAlign:"right"}}><div style={{fontSize:"24px",fontWeight:"800",color:C.green,letterSpacing:"-0.02em"}}>{best.weight}<span style={{fontSize:"14px",fontWeight:"500",color:C.textMid}}>{best.unit}</span></div><div style={{fontSize:"12px",color:C.textMid}}>{best.reps} reps</div></div></div>)}<div style={{textAlign:"center",fontSize:"12px",color:C.textDim,marginTop:"16px"}}>{sessions.length} session{sessions.length!==1?"s":""} logged</div></> }</div>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   TASKS MODULE
═══════════════════════════════════════════════════════════════════════════ */
function TasksModule({tasks,setTasks,persist}){
  const[text,setText]=useState("");
  const[priority,setPriority]=useState("medium");
  const[dueDate,setDueDate]=useState("");
  const[filter,setFilter]=useState("all");
  const todayStr=new Date().toISOString().split("T")[0];

  async function addTask(){
    if(!text.trim())return;
    const t={id:Date.now(),text:text.trim(),priority,done:false,dueDate:dueDate||null,created:new Date().toISOString()};
    const updated=[t,...tasks];setTasks(updated);await persist(SK.tasks,updated);setText("");setDueDate("");
  }
  async function toggleTask(id){const updated=tasks.map(t=>t.id===id?{...t,done:!t.done,completedAt:!t.done?new Date().toISOString():null}:t);setTasks(updated);await persist(SK.tasks,updated);}
  async function deleteTask(id){const updated=tasks.filter(t=>t.id!==id);setTasks(updated);await persist(SK.tasks,updated);}

  const PCOLORS={high:C.red,medium:C.yellow,low:C.green};

  function dueDateLabel(t){
    if(!t.dueDate||t.done)return null;
    const diff=Math.ceil((new Date(t.dueDate)-new Date(todayStr))/(1000*60*60*24));
    if(diff<0)return{label:`${Math.abs(diff)}d overdue`,color:C.red,urgent:true};
    if(diff===0)return{label:"Due today",color:C.orange,urgent:true};
    if(diff===1)return{label:"Due tomorrow",color:C.yellow,urgent:false};
    return{label:`Due in ${diff}d`,color:C.textMid,urgent:false};
  }

  // Sort: overdue first, then by due date, then undated
  const sorted=useMemo(()=>[...tasks].sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    if(!a.dueDate&&!b.dueDate)return 0;
    if(!a.dueDate)return 1;
    if(!b.dueDate)return -1;
    return new Date(a.dueDate)-new Date(b.dueDate);
  }),[tasks]);

  const visible=sorted.filter(t=>filter==="all"?true:filter==="active"?!t.done:filter==="overdue"?(!t.done&&t.dueDate&&new Date(t.dueDate)<new Date(todayStr)):t.done);
  const done=tasks.filter(t=>t.done).length;
  const overdue=tasks.filter(t=>!t.done&&t.dueDate&&t.dueDate<todayStr).length;

  return(
    <div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px",marginBottom:"16px"}}>
        <input placeholder="Add a task..." value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTask()} style={{...field,marginBottom:"10px"}}/>
        <div style={{display:"flex",gap:"8px",marginBottom:"10px",alignItems:"center"}}>
          {["high","medium","low"].map(p=>(
            <button key={p} onClick={()=>setPriority(p)} style={{padding:"6px 12px",borderRadius:"8px",border:`1px solid ${priority===p?PCOLORS[p]:C.border}`,background:priority===p?`${PCOLORS[p]}22`:"none",color:priority===p?PCOLORS[p]:C.textMid,fontSize:"12px",fontWeight:"600",cursor:"pointer",fontFamily:font,textTransform:"capitalize"}}>{p}</button>
          ))}
        </div>
        <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
          <div style={{position:"relative",flex:1}}>
            <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)}
              style={{...field,fontSize:"13px",color:dueDate?C.text:C.textDim}}/>
            {!dueDate&&<span style={{position:"absolute",left:"12px",top:"50%",transform:"translateY(-50%)",fontSize:"13px",color:C.textDim,pointerEvents:"none"}}>Due date (optional)</span>}
          </div>
          <button onClick={addTask} style={{...primaryBtn(C.yellow),width:"auto",padding:"10px 18px",boxShadow:"none",fontSize:"14px",flexShrink:0}}>Add</button>
        </div>
      </div>

      {tasks.length>0&&(
        <div style={{display:"flex",gap:"6px",marginBottom:"14px",flexWrap:"wrap"}}>
          {[["all","All"],["active","Active"],["overdue","Overdue"],["done","Done"]].map(([k,l])=>(
            <button key={k} onClick={()=>setFilter(k)} style={pill(filter===k,k==="overdue"?C.red:C.yellow,k==="overdue"?C.redDim:C.yellowDim)}>
              {l}{k==="overdue"&&overdue>0&&<span style={{marginLeft:"4px",background:C.red,color:"#fff",borderRadius:"10px",padding:"0 5px",fontSize:"10px",fontWeight:"700"}}>{overdue}</span>}
            </button>
          ))}
          <span style={{marginLeft:"auto",fontSize:"12px",color:C.textMid,display:"flex",alignItems:"center"}}>{done}/{tasks.length}</span>
        </div>
      )}

      {visible.length===0?(
        <Empty icon="✅" text="No tasks here" sub={filter==="overdue"?"Nothing overdue — great!":filter==="done"?"Complete some tasks first":"You're all caught up!"}/>
      ):visible.map(t=>{
        const due=dueDateLabel(t);
        return(
          <div key={t.id} style={{
            background:C.card,
            border:`1px solid ${due?.urgent&&!t.done?due.color+"66":C.border}`,
            borderRadius:"12px",padding:"13px 14px",marginBottom:"8px",
            display:"flex",alignItems:"center",gap:"12px",
            opacity:t.done?0.55:1,transition:"all 0.2s",
          }}>
            <button onClick={()=>toggleTask(t.id)} style={{width:"22px",height:"22px",borderRadius:"6px",border:`2px solid ${t.done?C.green:PCOLORS[t.priority]}`,background:t.done?C.green:"none",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"13px",transition:"all 0.15s"}}>{t.done?"✓":""}</button>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:"14px",color:C.text,textDecoration:t.done?"line-through":"none",fontWeight:"500",marginBottom:"3px"}}>{t.text}</div>
              <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontSize:"11px",color:PCOLORS[t.priority],textTransform:"capitalize",fontWeight:"600"}}>{t.priority}</span>
                {due&&<span style={{fontSize:"11px",color:due.color,fontWeight:due.urgent?"700":"500"}}>{due.urgent&&"⚠ "}{due.label}</span>}
              </div>
            </div>
            <button onClick={()=>deleteTask(t.id)} style={iconBtn(C.textDim)}>✕</button>
          </div>
        );
      })}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   HABITS MODULE
═══════════════════════════════════════════════════════════════════════════ */
function HabitsModule({habits,setHabits,persist}){
  const[name,setName]=useState("");const[emoji,setEmoji]=useState("⭐");
  const today=new Date().toISOString().split("T")[0];
  const EMOJIS=["⭐","💧","📚","🧘","🥗","😴","🏃","💊","🧹","✍️","🎯","🚶"];
  async function addHabit(){if(!name.trim())return;const h={id:Date.now(),name:name.trim(),emoji,streak:0,log:[]};const updated=[...habits,h];setHabits(updated);await persist(SK.habits,updated);setName("");}
  async function toggleHabit(id){const updated=habits.map(h=>{if(h.id!==id)return h;const doneToday=h.log.includes(today);const log=doneToday?h.log.filter(d=>d!==today):[...h.log,today];const streak=calcStreak(log);return{...h,log,streak};});setHabits(updated);await persist(SK.habits,updated);}
  async function deleteHabit(id){const updated=habits.filter(h=>h.id!==id);setHabits(updated);await persist(SK.habits,updated);}
  function calcStreak(log){let s=0;let d=new Date();while(true){const ds=d.toISOString().split("T")[0];if(!log.includes(ds))break;s++;d.setDate(d.getDate()-1);}return s;}
  const weekDays=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().split("T")[0];});
  return(
    <div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px",marginBottom:"16px"}}>
        <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"10px"}}>{EMOJIS.map(e=><button key={e} onClick={()=>setEmoji(e)} style={{width:"36px",height:"36px",borderRadius:"8px",border:`1px solid ${emoji===e?C.orange:C.border}`,background:emoji===e?C.orangeDim:"none",fontSize:"18px",cursor:"pointer"}}>{e}</button>)}</div>
        <div style={{display:"flex",gap:"8px"}}>
          <input placeholder="New habit name..." value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addHabit()} style={{...field,flex:1}}/>
          <button onClick={addHabit} style={{...primaryBtn(C.orange),width:"auto",padding:"10px 16px",boxShadow:"none",fontSize:"14px"}}>Add</button>
        </div>
      </div>
      {habits.length===0?<Empty icon="🔥" text="No habits yet" sub="Build consistency by tracking daily habits"/>:habits.map(h=>{const doneToday=h.log.includes(today);return(
        <div key={h.id} style={{background:C.card,border:`1px solid ${doneToday?C.orange:C.border}`,borderRadius:"14px",padding:"14px 16px",marginBottom:"10px",transition:"border-color 0.2s"}}>
          <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"12px"}}>
            <button onClick={()=>toggleHabit(h.id)} style={{width:"44px",height:"44px",borderRadius:"12px",border:`2px solid ${doneToday?C.orange:C.border}`,background:doneToday?C.orangeDim:"none",fontSize:"22px",cursor:"pointer",transition:"all 0.2s"}}>{h.emoji}</button>
            <div style={{flex:1}}><div style={{fontSize:"15px",fontWeight:"600",color:C.text}}>{h.name}</div><div style={{fontSize:"12px",color:C.orange,marginTop:"2px"}}>🔥 {h.streak} day streak</div></div>
            <button onClick={()=>deleteHabit(h.id)} style={iconBtn(C.textDim)}>✕</button>
          </div>
          <div style={{display:"flex",gap:"4px"}}>
            {weekDays.map(d=><div key={d} style={{flex:1,aspectRatio:"1",borderRadius:"6px",background:h.log.includes(d)?C.orange:C.surface,border:`1px solid ${h.log.includes(d)?C.orange:C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9px",color:h.log.includes(d)?"#fff":C.textDim,fontWeight:"700"}}>{new Date(d+"T12:00:00").toLocaleDateString("en",{weekday:"narrow"})}</div>)}
          </div>
        </div>
      );})}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   GOALS MODULE
═══════════════════════════════════════════════════════════════════════════ */
function GoalsModule({goals,setGoals,persist}){
  const[form,setForm]=useState({title:"",target:"",unit:"",current:"",deadline:""});const[adding,setAdding]=useState(false);
  async function addGoal(){if(!form.title.trim())return;const g={id:Date.now(),...form,current:parseFloat(form.current)||0,target:parseFloat(form.target)||100};const updated=[...goals,g];setGoals(updated);await persist(SK.goals,updated);setForm({title:"",target:"",unit:"",current:"",deadline:""});setAdding(false);}
  async function updateProgress(id,val){const updated=goals.map(g=>g.id===id?{...g,current:Math.min(parseFloat(val)||0,g.target)}:g);setGoals(updated);await persist(SK.goals,updated);}
  async function deleteGoal(id){const updated=goals.filter(g=>g.id!==id);setGoals(updated);await persist(SK.goals,updated);}
  return(
    <div>
      {adding&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px",marginBottom:"16px"}}>
        <div style={{fontSize:"16px",fontWeight:"700",color:C.text,marginBottom:"14px"}}>New Goal</div>
        {[["title","Goal title","text"],["target","Target value","number"],["unit","Unit (kg, km, books…)","text"],["current","Current value","number"],["deadline","Deadline","date"]].map(([k,ph,t])=><input key={k} type={t} placeholder={ph} value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} style={{...field,marginBottom:"10px"}}/>)}
        <div style={{display:"flex",gap:"8px"}}><button onClick={()=>setAdding(false)} style={{flex:1,padding:"12px",background:"none",border:`1px solid ${C.border}`,borderRadius:"10px",color:C.textMid,cursor:"pointer",fontFamily:font}}>Cancel</button><button onClick={addGoal} style={{...primaryBtn(C.purple),flex:1,boxShadow:"none"}}>Save Goal</button></div>
      </div>}
      {!adding&&<button onClick={()=>setAdding(true)} style={{...primaryBtn(C.purple),marginBottom:"16px"}}>+ New Goal</button>}
      {goals.length===0?<Empty icon="🎯" text="No goals yet" sub="Set goals and track your progress"/>:goals.map(g=>{const pct=Math.min(100,Math.round(((g.current||0)/g.target)*100));return(
        <div key={g.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px",marginBottom:"12px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px"}}>
            <div style={{flex:1}}><div style={{fontSize:"16px",fontWeight:"700",color:C.text}}>{g.title}</div>{g.deadline&&<div style={{fontSize:"12px",color:C.textMid,marginTop:"3px"}}>Target: {fmtDate(g.deadline)}</div>}</div>
            <button onClick={()=>deleteGoal(g.id)} style={iconBtn(C.textDim)}>✕</button>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"8px"}}>
            <span style={{fontSize:"13px",color:C.textMid}}>{g.current||0} {g.unit} of {g.target} {g.unit}</span>
            <span style={{fontSize:"14px",fontWeight:"700",color:pct>=100?C.green:C.purple}}>{pct}%</span>
          </div>
          <div style={{height:"8px",background:C.surface,borderRadius:"4px",marginBottom:"12px",overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:pct>=100?C.green:C.purple,borderRadius:"4px",transition:"width 0.3s"}}/></div>
          <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
            <input type="number" value={g.current||0} onChange={e=>updateProgress(g.id,e.target.value)} style={{...numInput,flex:1,textAlign:"left",padding:"8px 10px"}}/>
            <span style={{fontSize:"13px",color:C.textMid}}>{g.unit}</span>
          </div>
        </div>
      );})}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   HOME SCREEN
═══════════════════════════════════════════════════════════════════════════ */
function HomeScreen({data,navigate}){
  const now=new Date();
  const hour=now.getHours();
  const greeting=hour<12?"Good morning":hour<17?"Good afternoon":"Good evening";
  const dayStr=now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const{sessions,tasks,habits,goals}=data;
  const todayStr=now.toISOString().split("T")[0];

  const lastWorkout=sessions[0];
  const pendingTasks=tasks.filter(t=>!t.done).length;
  const overdueTasks=tasks.filter(t=>!t.done&&t.dueDate&&t.dueDate<todayStr).length;
  const doneToday=habits.filter(h=>h.log&&h.log.includes(todayStr)).length;
  const habitsTotal=habits.length;
  const goalsActive=goals.length;
  const goalsComplete=goals.filter(g=>(g.current||0)>=g.target).length;
  const topStreak=habits.length>0?Math.max(...habits.map(h=>h.streak||0)):0;

  const QUOTES=[
    "Small steps every day beat big steps someday.",
    "Discipline is just choosing between what you want now and what you want most.",
    "The hard part isn't starting. It's not stopping.",
    "You don't rise to your goals. You fall to your systems.",
    "Progress is progress, no matter the size.",
    "Show up. The rest follows.",
    "Consistency beats intensity every time.",
    "One percent better every day.",
    "The best time to start was yesterday. The next best time is now.",
    "Do the thing you said you'd do.",
    "Tired is temporary. Quitting lasts forever.",
    "Your future self is watching.",
    "Hard days build strong people.",
    "Don't negotiate with excuses.",
    "Results live on the other side of effort.",
    "Make today count.",
    "Earn it.",
    "Less talk. More reps.",
    "The only bad workout is the one you skipped.",
    "Comfort is the enemy of growth.",
    "You've done hard things before.",
    "Stay the course.",
    "Work in silence. Let results speak.",
    "Short-term pain. Long-term gain.",
    "Focus on what you can control.",
  ];
  const quote=useMemo(()=>QUOTES[Math.floor((now.getDate()*31+now.getMonth()*12)%QUOTES.length)],[]);

  const QUICK=[
    {key:"exercise",icon:"💪",label:"Exercise",color:C.green,bg:C.greenDim},
    {key:"metrics",icon:"📊",label:"Body",color:C.cyan,bg:C.cyanDim},
    {key:"tasks",icon:"✅",label:"Tasks",color:C.yellow,bg:C.yellowDim},
    {key:"habits",icon:"🔥",label:"Habits",color:C.orange,bg:C.orangeDim},
    {key:"goals",icon:"🎯",label:"Goals",color:C.purple,bg:C.purpleDim},
  ];

  return(
    <div style={{paddingBottom:"8px"}}>

      {/* ── Greeting ───────────────────────────────────────────────── */}
      <div style={{marginBottom:"20px",paddingTop:"4px"}}>
        <div style={{fontSize:"13px",color:C.textMid,fontWeight:"500",marginBottom:"4px",letterSpacing:"0.01em"}}>{dayStr}</div>
      </div>

      {/* ── Quote ──────────────────────────────────────────────────── */}
      <div style={{
        marginBottom:"28px",
        padding:"14px 16px",
        background:"rgba(59,130,246,0.06)",
        borderRadius:"14px",
        borderLeft:`2px solid ${C.blue}`,
      }}>
        <div style={{fontSize:"11px",fontWeight:"700",letterSpacing:"0.1em",color:C.blue,marginBottom:"5px",opacity:0.8}}>TODAY</div>
        <div style={{fontSize:"14px",fontWeight:"500",color:C.textMid,lineHeight:1.5,fontStyle:"italic"}}>"{quote}"</div>
      </div>

      {/* ── Quick Access ───────────────────────────────────────────── */}
      <div style={{
        display:"grid",gridTemplateColumns:"repeat(5,1fr)",
        gap:"8px",marginBottom:"28px",
      }}>
        {QUICK.map(q=>(
          <button key={q.key} onClick={()=>navigate(q.key)} style={{
            display:"flex",flexDirection:"column",alignItems:"center",
            gap:"7px",padding:"12px 4px 10px",
            background:C.card,border:`1px solid ${C.border}`,
            borderRadius:"18px",cursor:"pointer",fontFamily:font,
            transition:"all 0.18s",
          }}
            onMouseOver={e=>{e.currentTarget.style.borderColor=q.color;e.currentTarget.style.transform="scale(0.97)";}}
            onMouseOut={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.transform="scale(1)";}}
          >
            <div style={{
              width:"42px",height:"42px",borderRadius:"13px",
              background:q.bg,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px",
            }}>{q.icon}</div>
            <span style={{fontSize:"10px",fontWeight:"600",color:C.textMid,textAlign:"center",lineHeight:1.2,letterSpacing:"0.01em"}}>{q.label}</span>
          </button>
        ))}
      </div>

      {/* ── Stats grid ─────────────────────────────────────────────── */}
      <div style={{marginBottom:"10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:C.textDim,letterSpacing:"0.06em"}}>OVERVIEW</div>
      </div>

      {/* Row 1 — full-width workout card */}
      <div onClick={()=>navigate("exercise")} style={{
        background:C.card,border:`1px solid ${C.border}`,
        borderRadius:"20px",padding:"18px 20px",
        marginBottom:"10px",cursor:"pointer",
        display:"flex",alignItems:"center",gap:"16px",
        transition:"all 0.18s",
      }}
        onMouseOver={e=>e.currentTarget.style.borderColor=C.green}
        onMouseOut={e=>e.currentTarget.style.borderColor=C.border}
      >
        <div style={{
          width:"52px",height:"52px",borderRadius:"16px",flexShrink:0,
          background:C.greenDim,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:"26px",
        }}>💪</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:"12px",color:C.textDim,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"4px"}}>LAST WORKOUT</div>
          <div style={{fontSize:"17px",fontWeight:"700",color:C.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
            {lastWorkout?lastWorkout.name:"No sessions yet"}
          </div>
          {lastWorkout&&<div style={{fontSize:"13px",color:C.green,marginTop:"2px",fontWeight:"500"}}>{fmtRel(lastWorkout.date)}</div>}
        </div>
        <div style={{color:C.textDim,fontSize:"20px",flexShrink:0}}>›</div>
      </div>

      {/* Row 2 — two equal cards */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}}>
        {/* Tasks */}
        <div onClick={()=>navigate("tasks")} style={{
          background:C.card,border:`1px solid ${C.border}`,
          borderRadius:"20px",padding:"18px",cursor:"pointer",
          transition:"all 0.18s",
        }}
          onMouseOver={e=>e.currentTarget.style.borderColor=C.yellow}
          onMouseOut={e=>e.currentTarget.style.borderColor=C.border}
        >
          <div style={{fontSize:"12px",color:C.textDim,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"10px"}}>TASKS</div>
          <div style={{fontSize:"36px",fontWeight:"800",letterSpacing:"-0.03em",color:pendingTasks>0?C.yellow:C.green,lineHeight:1}}>{pendingTasks}</div>
          <div style={{fontSize:"13px",color:C.textMid,marginTop:"4px"}}>pending</div>
          {overdueTasks>0&&(
            <div style={{marginTop:"8px",padding:"4px 8px",background:C.redDim,border:`1px solid ${C.red}44`,borderRadius:"8px",display:"inline-block"}}>
              <span style={{fontSize:"11px",color:C.red,fontWeight:"700"}}>⚠ {overdueTasks} overdue</span>
            </div>
          )}
        </div>

        {/* Habits */}
        <div onClick={()=>navigate("habits")} style={{
          background:C.card,border:`1px solid ${C.border}`,
          borderRadius:"20px",padding:"18px",cursor:"pointer",
          transition:"all 0.18s",
        }}
          onMouseOver={e=>e.currentTarget.style.borderColor=C.orange}
          onMouseOut={e=>e.currentTarget.style.borderColor=C.border}
        >
          <div style={{fontSize:"12px",color:C.textDim,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"10px"}}>HABITS</div>
          <div style={{fontSize:"36px",fontWeight:"800",letterSpacing:"-0.03em",color:doneToday===habitsTotal&&habitsTotal>0?C.green:C.orange,lineHeight:1}}>{doneToday}<span style={{fontSize:"20px",color:C.textDim,fontWeight:"600"}}>/{habitsTotal}</span></div>
          <div style={{fontSize:"13px",color:C.textMid,marginTop:"4px"}}>done today</div>
          {topStreak>0&&<div style={{fontSize:"11px",color:C.orange,marginTop:"8px",fontWeight:"600"}}>🔥 {topStreak} day streak</div>}
        </div>
      </div>

      {/* Row 3 — goals */}
      {goals.length>0&&(
        <div onClick={()=>navigate("goals")} style={{
          background:C.card,border:`1px solid ${C.border}`,
          borderRadius:"20px",padding:"18px 20px",
          marginBottom:"10px",cursor:"pointer",
          transition:"all 0.18s",
        }}
          onMouseOver={e=>e.currentTarget.style.borderColor=C.purple}
          onMouseOut={e=>e.currentTarget.style.borderColor=C.border}
        >
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
            <div style={{fontSize:"12px",color:C.textDim,fontWeight:"600",letterSpacing:"0.06em"}}>GOALS</div>
            <div style={{fontSize:"13px",color:C.purple,fontWeight:"600"}}>{goalsComplete}/{goalsActive} done</div>
          </div>
          {goals.slice(0,3).map(g=>{
            const pct=Math.min(100,Math.round(((g.current||0)/g.target)*100));
            return(
              <div key={g.id} style={{marginBottom:"12px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"6px"}}>
                  <span style={{fontSize:"14px",color:C.text,fontWeight:"500",flex:1,paddingRight:"8px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{g.title}</span>
                  <span style={{fontSize:"13px",color:pct>=100?C.green:C.purple,fontWeight:"700",flexShrink:0}}>{pct}%</span>
                </div>
                <div style={{height:"4px",background:C.surface,borderRadius:"2px",overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${pct}%`,background:pct>=100?`linear-gradient(90deg,${C.green},${C.green}aa)`:`linear-gradient(90deg,${C.purple},${C.blue})`,borderRadius:"2px",transition:"width 0.4s"}}/>
                </div>
              </div>
            );
          })}
        </div>
      )}


    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════════════════════════ */
function App(){
  const[section,setSection]=useState("home");
  const[loading,setLoading]=useState(true);
  const[sessions,setSessions]=useState([]);
  const[tasks,setTasks]=useState([]);
  const[habits,setHabits]=useState([]);
  const[goals,setGoals]=useState([]);
  const[metrics,setMetrics]=useState({entries:[],goalWeight:null,goalBf:null});
  const[templates,setTemplates]=useState([]);

  useEffect(()=>{
    (async()=>{
      try{
        const load=async(key,fallback=[])=>{try{const r=await window_storage.get(key);return r?.value?JSON.parse(r.value):fallback;}catch{return fallback;}};
        const[w,t,h,g,m,tp]=await Promise.all([load(SK.workouts),load(SK.tasks),load(SK.habits),load(SK.goals),load(SK.metrics,{entries:[]}),load(SK.templates)]);
        setSessions(w);setTasks(t);setHabits(h);setGoals(g);setMetrics(m);setTemplates(tp);
      }catch(e){}
      setLoading(false);
    })();
  },[]);

  // Persist to Claude storage
  const persist=useCallback(async(key,data)=>{
    try{await window_storage.set(key,JSON.stringify(data));}catch{}
  },[]);


  const SECTION_TITLES={home:"My Life",exercise:"Exercise",metrics:"Body Metrics",tasks:"Tasks",habits:"Habits",goals:"Goals"};
  const sm=SECTION_META[section];

  if(loading) return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",color:C.textMid,fontFamily:font,fontSize:"16px"}}>Loading…</div>;

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:font,paddingBottom:"80px"}}>
      {/* HEADER */}
      <div style={{
        padding:"54px 20px 14px",
        background:"rgba(15,17,23,0.85)",
        backdropFilter:"blur(20px)",
        WebkitBackdropFilter:"blur(20px)",
        borderBottom:`1px solid ${C.border}`,
        position:"sticky",top:0,zIndex:10,
      }}>
        <div style={{display:"flex",alignItems:"center",gap:"12px",maxWidth:"540px",margin:"0 auto"}}>
          {section!=="home"&&(
            <button onClick={()=>setSection("home")} style={{
              background:"none",border:"none",
              color:C.blue,fontSize:"16px",fontWeight:"600",
              cursor:"pointer",padding:"4px 0",lineHeight:1,
              flexShrink:0,fontFamily:font,
              display:"flex",alignItems:"center",gap:"4px",
            }}>‹ Home</button>
          )}
          <div style={{flex:1}}>
            {section==="home"?(
              <div style={{fontSize:"13px",fontWeight:"600",color:C.textDim,letterSpacing:"0.04em"}}>PERSONAL HQ</div>
            ):(
              <div style={{fontSize:"18px",fontWeight:"700",letterSpacing:"-0.02em",color:C.text,display:"flex",alignItems:"center",gap:"8px"}}>
                <span>{sm.icon}</span><span>{SECTION_TITLES[section]}</span>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* BOTTOM NAV */}
      <div style={{
        position:"fixed",bottom:0,left:0,right:0,
        background:"rgba(15,17,23,0.92)",
        backdropFilter:"blur(20px)",
        WebkitBackdropFilter:"blur(20px)",
        borderTop:`1px solid ${C.border}`,
        display:"flex",zIndex:10,
        paddingBottom:"env(safe-area-inset-bottom,4px)",
      }}>
        {Object.entries(SECTION_META).map(([key,meta])=>(
          <button key={key} onClick={()=>setSection(key)} style={{
            flex:1,padding:"10px 0 6px",
            background:"none",border:"none",
            cursor:"pointer",fontFamily:font,
            display:"flex",flexDirection:"column",alignItems:"center",gap:"4px",
            transition:"all 0.15s",
          }}>
            <div style={{
              width:"32px",height:"32px",borderRadius:"10px",
              background:section===key?`${meta.color}22`:"none",
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:"19px",lineHeight:1,
              transition:"all 0.18s",
            }}>{meta.icon}</div>
            <span style={{
              fontSize:"10px",fontWeight:section===key?"700":"500",
              color:section===key?meta.color:C.textDim,
              letterSpacing:"0.01em",
            }}>{meta.label}</span>
          </button>
        ))}
      </div>

      {/* CONTENT */}
      <div style={{padding:"20px 16px",maxWidth:"540px",margin:"0 auto"}}>
        {section==="home"&&<HomeScreen data={{sessions,tasks,habits,goals}} navigate={setSection}/>}
        {section==="exercise"&&<ExerciseModule sessions={sessions} setSessions={setSessions} persist={persist} templates={templates} setTemplates={setTemplates}/>}
        {section==="metrics"&&<MetricsModule metrics={metrics} setMetrics={setMetrics} persist={persist}/>}
        {section==="tasks"&&<TasksModule tasks={tasks} setTasks={setTasks} persist={persist}/>}
        {section==="habits"&&<HabitsModule habits={habits} setHabits={setHabits} persist={persist}/>}
        {section==="goals"&&<GoalsModule goals={goals} setGoals={setGoals} persist={persist}/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

  </script>
</body>
</html>
